<!DOCTYPE html>
<!-- SHARED: update portal sidebar in all portal pages if changed -->
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RFQ Inbox — Vertex Metals Portal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/portal.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="portal-body">
<!-- SIDEBAR (copy from dashboard.html — update all portal pages if changed) -->
<aside class="sidebar" id="sidebar"></aside>

<div class="portal-main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:var(--space-3)">
      <button class="topbar-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">RFQ Inbox</span>
    </div>
    <button onclick="openNewRfqModal()" class="btn btn-primary btn-sm">+ New RFQ</button>
  </div>
  <div class="portal-content">
    <div class="portal-page-header">
      <div><h1>RFQ Inbox</h1><p>All buyer and supplier enquiries submitted via the public contact form</p></div>
    </div>
    <div class="filter-bar">
      <select class="form-select" id="filter-status" style="min-width:140px">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="reviewing">Reviewing</option>
        <option value="quoted">Quoted</option>
        <option value="accepted">Accepted</option>
        <option value="responded">Responded</option>
        <option value="closed">Closed</option>
      </select>
      <select class="form-select" id="filter-type" style="min-width:140px">
        <option value="">All types</option>
        <option value="buyer">Buyer</option>
        <option value="supplier">Supplier</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="loadRfqs()">Filter</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Company</th><th>Type</th><th>Product Interest</th><th>Status</th></tr></thead>
        <tbody id="rfq-table-body"><tr><td colspan="6" style="text-align:center;color:var(--color-text-muted);padding:var(--space-8)">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- New RFQ Modal -->
<div class="modal-overlay" id="new-rfq-modal">
  <div class="modal-box" style="max-width:600px">
    <button class="modal-close" onclick="document.getElementById('new-rfq-modal').classList.remove('open')">✕</button>
    <h3>New RFQ</h3>
    <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-5)">Manually log an enquiry received by email or phone.</p>
    <form id="new-rfq-form" onsubmit="submitNewRfq(event)">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Contact Name <span style="color:var(--color-danger)">*</span></label>
          <input type="text" class="form-input" id="nrfq-name" required placeholder="e.g. John Smith" />
        </div>
        <div class="form-group">
          <label class="form-label">Company <span style="color:var(--color-danger)">*</span></label>
          <input type="text" class="form-input" id="nrfq-company" required placeholder="e.g. Acme Manufacturing Ltd" />
        </div>
        <div class="form-group">
          <label class="form-label">Email <span style="color:var(--color-danger)">*</span></label>
          <input type="email" class="form-input" id="nrfq-email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" class="form-input" id="nrfq-phone" />
        </div>
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select" id="nrfq-type">
            <option value="buyer">Buyer</option>
            <option value="supplier">Supplier</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Role / Job Title</label>
          <input type="text" class="form-input" id="nrfq-role" placeholder="e.g. Procurement Manager" />
        </div>
        <div class="form-group">
          <label class="form-label">Product Interest</label>
          <input type="text" class="form-input" id="nrfq-product" placeholder="e.g. Aluminium Alloy Core Wire" />
        </div>
        <div class="form-group">
          <label class="form-label">Estimated Quantity (MT)</label>
          <input type="number" class="form-input" id="nrfq-qty" step="0.1" min="0" placeholder="e.g. 25" />
        </div>
        <div class="form-group">
          <label class="form-label">Country</label>
          <input type="text" class="form-input" id="nrfq-country" placeholder="e.g. United Kingdom" />
        </div>
      </div>
      <div class="form-group" style="margin-top:var(--space-3)">
        <label class="form-label">Message / Enquiry Detail</label>
        <textarea class="form-textarea" id="nrfq-message" rows="4" placeholder="Paste the email content or summarise the enquiry..."></textarea>
      </div>
      <div id="new-rfq-alert" class="alert" style="display:none;margin-top:var(--space-3)"></div>
      <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5)">
        <button type="submit" class="btn btn-primary" id="new-rfq-btn">Create RFQ</button>
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('new-rfq-modal').classList.remove('open')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/portal/sidebar.js"></script>

<script src="../../js/portal-guard.js"></script>
<script src="../../js/portal/rfq.js"></script>
</body>
</html>
