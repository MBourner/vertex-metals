<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier — Vertex Metals Portal</title>
  <link rel="stylesheet" href="../../css/variables.css" /><link rel="stylesheet" href="../../css/base.css" /><link rel="stylesheet" href="../../css/components.css" /><link rel="stylesheet" href="../../css/portal.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Sticky supplier header */
    .supplier-header { position:sticky; top:0; z-index:20; background:var(--color-surface); padding:var(--space-4) 0; margin-bottom:var(--space-6); border-bottom:1px solid var(--color-border); }
    .supplier-header__top { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:var(--space-4); }
    .supplier-header__id h1 { margin:0 0 var(--space-2); }
    .supplier-header__tags { display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap; }
    .supplier-header__capability { margin-top:var(--space-2); font-size:var(--text-sm); color:var(--color-text-muted); font-family:var(--font-display); letter-spacing:0.02em; }
    .supplier-header__actions { display:flex; gap:var(--space-2); flex-wrap:wrap; justify-content:flex-end; }

    /* Readiness bars */
    .readiness-row { display:flex; flex-direction:column; gap:var(--space-3); }
    .readiness-item__label { display:flex; justify-content:space-between; font-size:var(--text-xs); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--color-text-muted); margin-bottom:4px; }
    .readiness-bar { height:8px; border-radius:4px; background:var(--color-border); overflow:hidden; }
    .readiness-bar__fill { height:100%; background:var(--color-accent); border-radius:4px; transition:width .2s ease; }
    .readiness-bar__fill.complete { background:var(--color-success); }

    /* Permission pills */
    .perm-row { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-3); padding:var(--space-2) 0; border-bottom:1px solid var(--color-border); }
    .perm-row:last-child { border-bottom:none; }
    .perm-row__label { font-size:var(--text-sm); font-weight:500; }
    .perm-row__reason { font-size:var(--text-xs); color:var(--color-text-muted); margin-top:2px; }
    .perm-pill { flex-shrink:0; }

    /* Document centre */
    .doc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:var(--space-3); }
    .doc-card { border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:var(--space-3) var(--space-4); display:flex; flex-direction:column; gap:4px; }
    .doc-card__title { font-size:var(--text-sm); font-weight:600; }

    /* Currency chips (Edit Commercial Terms) */
    .currency-grid { display:flex; flex-wrap:wrap; gap:var(--space-4); }
    .currency-chip { display:flex; gap:var(--space-2); align-items:center; cursor:pointer; font-size:var(--text-sm); padding:var(--space-2) var(--space-3); border:1px solid var(--color-border); border-radius:var(--radius-sm); }
  </style>
</head>
<body class="portal-body">
<aside class="sidebar" id="sidebar"></aside>
<div class="portal-main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:var(--space-3)"><button class="topbar-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><span class="topbar-title" id="topbar-title">Supplier</span></div>
    <a href="index.html" class="btn btn-ghost btn-sm">← Suppliers</a>
  </div>
  <div class="portal-content">
    <div id="supplier-header" class="supplier-header"><div style="color:var(--color-text-muted)">Loading…</div></div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="overview"   onclick="switchTab('overview')">Overview</button>
      <button class="tab-btn"        data-tab="onboarding" onclick="switchTab('onboarding')">Onboarding</button>
      <button class="tab-btn"        data-tab="commercial" onclick="switchTab('commercial')">Commercial</button>
      <button class="tab-btn"        data-tab="products"   onclick="switchTab('products')">Products</button>
      <button class="tab-btn"        data-tab="documents"  onclick="switchTab('documents')">Documents</button>
      <button class="tab-btn"        data-tab="compliance" onclick="switchTab('compliance')">Compliance</button>
      <button class="tab-btn"        data-tab="finance"    onclick="switchTab('finance')">Finance</button>
      <button class="tab-btn"        data-tab="activity"   onclick="switchTab('activity')">Activity</button>
      <button class="tab-btn"        data-tab="orders"      onclick="switchTab('orders')">Orders</button>
      <button class="tab-btn"        data-tab="concessions" onclick="switchTab('concessions')">Concessions</button>
      <button class="tab-btn"        data-tab="disputes"    onclick="switchTab('disputes')">Disputes</button>
    </div>
    <div id="tab-overview"    class="tab-pane active"><div style="color:var(--color-text-muted)">Loading…</div></div>
    <div id="tab-onboarding"  class="tab-pane"></div>
    <div id="tab-commercial"  class="tab-pane"></div>
    <div id="tab-products"    class="tab-pane"></div>
    <div id="tab-documents"   class="tab-pane"></div>
    <div id="tab-compliance"  class="tab-pane"></div>
    <div id="tab-finance"     class="tab-pane"></div>
    <div id="tab-activity"    class="tab-pane"></div>
    <div id="tab-orders"      class="tab-pane"></div>
    <div id="tab-concessions" class="tab-pane"></div>
    <div id="tab-disputes"    class="tab-pane"></div>
  </div>
</div>

<!-- Edit Address Modal -->
<div class="modal-overlay" id="edit-address-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('edit-address-modal').classList.remove('open')">✕</button>
    <h3>Edit Address</h3>
    <div id="edit-address-form-container"></div>
  </div>
</div>

<!-- Edit Bank Details Modal -->
<div class="modal-overlay" id="edit-bank-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('edit-bank-modal').classList.remove('open')">✕</button>
    <h3>Edit Bank Details</h3>
    <div id="edit-bank-form-container"></div>
  </div>
</div>

<!-- Edit Commercial Terms Modal -->
<div class="modal-overlay" id="edit-commercial-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('edit-commercial-modal').classList.remove('open')">✕</button>
    <h3>Edit Commercial Terms</h3>
    <div id="edit-commercial-form-container"></div>
  </div>
</div>

<!-- Add Product Modal -->
<div class="modal-overlay" id="add-product-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('add-product-modal').classList.remove('open')">✕</button>
    <h3>Add Product</h3>
    <div id="add-product-form-container"></div>
  </div>
</div>

<!-- Edit Product Modal -->
<div class="modal-overlay" id="edit-product-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('edit-product-modal').classList.remove('open')">✕</button>
    <h3>Edit Product</h3>
    <div id="edit-product-form-container"></div>
  </div>
</div>

<script src="../../js/supabase-client.js"></script><script src="../../js/auth.js"></script><script src="../../js/portal/auth-roles.js"></script><script src="../../js/portal/sidebar.js"></script>
<script src="../../js/portal-guard.js"></script><script src="../../js/portal/state-machine.js"></script><script src="../../js/portal/supplier-onboarding.js"></script><script src="../../js/portal/countries.js"></script><script src="../../js/portal/suppliers-detail.js"></script>
</body></html>
