<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supplier Onboarding — Vertex Metals Portal</title>
  <link rel="stylesheet" href="../../css/variables.css" /><link rel="stylesheet" href="../../css/base.css" /><link rel="stylesheet" href="../../css/components.css" /><link rel="stylesheet" href="../../css/portal.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .form-section { border:1px solid var(--color-border); border-left:4px solid var(--color-accent); border-radius:var(--radius); margin-bottom:var(--space-6); overflow:hidden; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.03); }
    .form-section__header { background:rgba(122,184,212,0.06); padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--color-border); font-family:var(--font-display); font-size:var(--text-sm); font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--color-text-primary); display:flex; align-items:center; justify-content:space-between; }
    .form-section__body { padding:var(--space-6); }
    .form-section__divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-5) 0; }
    .form-section__sub { font-family:var(--font-display); font-size:var(--text-xs); font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-accent-dark); margin-bottom:var(--space-4); }
  </style>
</head>
<body class="portal-body">
<aside class="sidebar" id="sidebar"></aside>
<div class="portal-main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:var(--space-3)">
      <button class="topbar-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title" id="topbar-title">Supplier Onboarding</span>
    </div>
    <a href="index.html" id="back-link" class="btn btn-ghost btn-sm">← Suppliers</a>
  </div>

  <div class="portal-content" style="max-width:860px">

    <div class="portal-page-header" style="margin-bottom:var(--space-6)">
      <div>
        <h1 id="page-heading">Supplier Onboarding</h1>
        <p id="page-subheading">Work through each stage to register, review, vet and activate this supplier.</p>
      </div>
    </div>

    <!-- ── Stage 1a ────────────────────────────────────────── -->
    <div id="acc-s1a" class="acc-section">
      <div class="acc-header" onclick="accToggle('s1a')">
        <div class="acc-header-left">
          <div class="acc-status" id="acc-s1a-icon"></div>
          <div>
            <div class="acc-title">Stage 1a — Supplier Registration</div>
            <div class="acc-subtitle" id="acc-s1a-sub"></div>
          </div>
        </div>
        <svg class="acc-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="acc-body" id="acc-s1a-body"></div>
    </div>

    <!-- ── Stage 1b ────────────────────────────────────────── -->
    <div id="acc-s1b" class="acc-section">
      <div class="acc-header" onclick="accToggle('s1b')">
        <div class="acc-header-left">
          <div class="acc-status" id="acc-s1b-icon"></div>
          <div>
            <div class="acc-title">Stage 1b — Compliance Review</div>
            <div class="acc-subtitle" id="acc-s1b-sub"></div>
          </div>
        </div>
        <svg class="acc-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="acc-body" id="acc-s1b-body"></div>
    </div>

    <!-- ── Stage 2 ─────────────────────────────────────────── -->
    <div id="acc-s2" class="acc-section">
      <div class="acc-header" onclick="accToggle('s2')">
        <div class="acc-header-left">
          <div class="acc-status" id="acc-s2-icon"></div>
          <div>
            <div class="acc-title">Stage 2 — Pre-Trade Vetting</div>
            <div class="acc-subtitle" id="acc-s2-sub"></div>
          </div>
        </div>
        <svg class="acc-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="acc-body" id="acc-s2-body"></div>
    </div>

    <!-- ── Stage 3 ─────────────────────────────────────────── -->
    <div id="acc-s3" class="acc-section">
      <div class="acc-header" onclick="accToggle('s3')">
        <div class="acc-header-left">
          <div class="acc-status" id="acc-s3-icon"></div>
          <div>
            <div class="acc-title">Stage 3 — Trade Ready Sign-off</div>
            <div class="acc-subtitle" id="acc-s3-sub"></div>
          </div>
        </div>
        <svg class="acc-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="acc-body" id="acc-s3-body"></div>
    </div>

  </div>
</div>

<!-- Add Product Modal (used by Stage 1a) -->
<div class="modal-overlay" id="add-product-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('add-product-modal').classList.remove('open')">✕</button>
    <h3>Add Product</h3>
    <div id="add-product-form-container"></div>
  </div>
</div>

<script src="../../js/supabase-client.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/portal/auth-roles.js"></script>
<script src="../../js/portal/sidebar.js"></script>
<script src="../../js/portal-guard.js"></script>
<script src="../../js/portal/state-machine.js"></script>
<script src="../../js/portal/supplier-onboarding.js"></script>
<script src="../../js/portal/onboarding-accordion.js"></script>
</body>
</html>
