<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Redirecting…</title></head>
<body>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var sid = p.get('supplier_id');
  location.replace(sid ? 'onboard.html?supplier_id=' + encodeURIComponent(sid) : 'onboard.html');
})();
</script>
</body>
</html>
